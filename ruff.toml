line-length = 110
target-version = "py311"

[lint]
select = ["E", "F", "W", "I", "UP", "B", "SIM", "RUF", "ASYNC", "PT", "NPY", "PD"]
ignore = [
    "RUF001", "RUF002", "RUF003",  # кириллица в строках и комментариях не опечатка
]

[lint.per-file-ignores]
"tests/**" = ["PT018"]  # короткие составные assert в тестах читаются легче
